name: Multi-Platform Automated Release

on:
  push:
    tags:
      - 'beta-2'
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version (e.g. beta-2 or v1.0.0-beta.2)'
        required: true
        default: 'beta-2'

concurrency:
  group: release-workflow-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK Release
        run: flutter build apk --release

      - name: Prepare Android Artifact
        run: |
          mkdir -p output
          cp build/app/outputs/flutter-apk/app-release.apk output/LexoPlayer-Android.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-artifacts
          path: output/*

  build-macos:
    name: Build macOS Application & DMG
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build macOS Release
        run: flutter build macos --release

      - name: Create macOS DMG Artifact
        run: |
          mkdir -p "$GITHUB_WORKSPACE/output"
          cd build/macos/Build/Products/Release
          hdiutil create -volname "LexoPlayer" -srcfolder Lexo.app -ov -format UDZO "$GITHUB_WORKSPACE/output/LexoPlayer-macOS.dmg"

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-artifacts
          path: output/*

  build-windows:
    name: Build Windows Application & Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Build Inno Setup Installer
        run: |
          iscc installer.iss

      - name: Prepare Windows Installer Artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path output
          Copy-Item "build\windows\installer\LexoPlayer-Setup-x64.exe" -Destination "output\"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-artifacts
          path: output/*

  build-linux:
    name: Build Linux Universal AppImage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libmpv-dev wget fuse

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Linux Release
        run: flutter build linux --release

      - name: Create Universal AppImage
        run: |
          mkdir -p output
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/lib/lexoplayer

          cp -r build/linux/x64/release/bundle/* AppDir/usr/lib/lexoplayer/
          cp linux/lexoplayer.desktop AppDir/lexoplayer.desktop
          cp linux/lexoplayer.desktop AppDir/
          if [ -f "assests/icon/icon.png" ]; then
            cp assests/icon/icon.png AppDir/lexoplayer.png
            cp assests/icon/icon.png AppDir/.DirIcon
          fi

          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "${HERE}/usr/lib/lexoplayer/lexo_player" "$@"
          EOF
          chmod +x AppDir/AppRun

          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool || wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool || true
          if [ -f appimagetool ]; then
            chmod +x appimagetool
            ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir output/LexoPlayer-Linux.AppImage || true
          fi

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-artifacts
          path: output/*

  publish-release:
    name: Create GitHub Release & Attach Binaries
    needs: [build-android, build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release-artifacts
          path: release-files

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-release-artifacts
          path: release-files

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release-artifacts
          path: release-files

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-release-artifacts
          path: release-files

      - name: Determine Release Tag
        id: tag_name
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=${{ github.event.inputs.release_version }}" >> $GITHUB_ENV
          else
            echo "TAG=${{ github.ref_name }}" >> $GITHUB_ENV
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Release ${{ env.TAG }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            release-files/*
