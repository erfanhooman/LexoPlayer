name: Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Code Analysis & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:${{ hashFiles('**/pubspec.lock') }}"

      - name: Install Dependencies
        run: flutter pub get

      - name: Check Code Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze Project Source
        run: flutter analyze --no-fatal-infos

      - name: Run Unit & Widget Tests
        run: flutter test

  build-check:
    name: Build Check (${{ matrix.os }})
    needs: lint-and-test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
            command: flutter build macos --release
          - os: windows-latest
            target: windows
            command: flutter build windows --release
          - os: ubuntu-latest
            target: linux
            command: flutter build linux --release

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libmpv-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:${{ hashFiles('**/pubspec.lock') }}"

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Desktop Release Candidate
        run: ${{ matrix.command }}

      - name: Upload Build Artifacts (CI Run)
        uses: actions/upload-artifact@v4
        with:
          name: lexo-player-${{ matrix.target }}-ci
          path: |
            build/${{ matrix.target }}/Build/Products/Release/*.app
            build/${{ matrix.target }}/x64/runner/Release/*
            build/${{ matrix.target }}/x64/release/bundle/*
          retention-days: 7
